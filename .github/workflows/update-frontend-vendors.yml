name: Update frontend vendors

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vendors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Update Vue and Vuex bundles
        run: python scripts/update_frontend_vendors.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update frontend vendor bundles"
          title: "chore: update frontend vendor bundles"
          body: |
            Automated update of vendored frontend bundles:
            - vuegram/static/js/vue.global.js
            - vuegram/static/js/vuex.global.js
            - vuegram/static/js/vendor-manifest.json
          branch: chore/update-frontend-vendors
          delete-branch: true
