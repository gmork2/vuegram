[project]
name = "vuegram"
version = "0.2.0"
description = "Simple websocket chat made with vuejs and aiohttp."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "aiohttp-jinja2",
    "aiohttp-sse",
    "jinja2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-aiohttp>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
